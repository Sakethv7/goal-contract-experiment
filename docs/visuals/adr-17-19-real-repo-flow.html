<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real repo flow</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #555;
    --old-fill: #e8e8e8; --old-stroke: #7a7a7a; --old-text: #1a1a1a;
    --new-fill: #cfe3ff; --new-stroke: #2a62b8; --new-text: #10264d;
    --fail-fill: #ffd6d6; --fail-stroke: #b82a2a; --fail-text: #4d1010;
    --line: #444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #ececec; --muted: #aaa;
      --old-fill: #2c2f35; --old-stroke: #8b909a; --old-text: #ececec;
      --new-fill: #1b3558; --new-stroke: #6aa4f0; --new-text: #dbe9ff;
      --fail-fill: #4a1d1d; --fail-stroke: #f08a8a; --fail-text: #ffdede;
      --line: #bbb;
    }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 10px 16px; }
  h1 { font-size: 17px; margin: 4px 0; }
  p.sub { font-size: 12.5px; margin: 0 0 6px; color: var(--muted); }
  .key { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; margin: 4px 0 6px; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 16px; height: 16px; border-radius: 3px; border: 2px solid; display: inline-block; }
  .sw.old { background: var(--old-fill); border-color: var(--old-stroke); }
  .sw.new { background: var(--new-fill); border-color: var(--new-stroke); }
  .sw.fail { background: var(--fail-fill); border-color: var(--fail-stroke); }
  svg { width: 100%; max-height: calc(100vh - 120px); display: block; }
  .old  { fill: var(--old-fill);  stroke: var(--old-stroke);  stroke-width: 1.6; }
  .new  { fill: var(--new-fill);  stroke: var(--new-stroke);  stroke-width: 1.6; }
  .fail { fill: var(--fail-fill); stroke: var(--fail-stroke); stroke-width: 1.6; }
  text { font-size: 12.5px; text-anchor: middle; dominant-baseline: central; }
  text.old  { fill: var(--old-text);  stroke: none; }
  text.new  { fill: var(--new-text);  stroke: none; }
  text.fail { fill: var(--fail-text); stroke: none; }
  text.lbl { fill: var(--fg); stroke: none; font-size: 11.5px; font-weight: 600; }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .head { fill: var(--line); stroke: none; }
</style>
</head>
<body>
<main>
  <h1>Real repo test: check, smoke, then the main batch</h1>
  <p class="sub">Read from the top. Each red box is a drop, a stop, or a repeat. Every run works on a throwaway copy of the parent commit. The real folder is never edited.</p>
  <div class="key" aria-label="Key">
    <span><i class="sw old"></i>Exists today</span>
    <span><i class="sw new"></i>New in Part 4</span>
    <span><i class="sw fail"></i>Failure path or stop</span>
  </div>
  <svg viewBox="0 0 780 650" role="img" aria-label="Flowchart of the real repo test: task check, venv probe, smoke run with a cut check, main batch and scoring">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="head"/>
      </marker>
    </defs>
    <rect class="new" x="265.0" y="8" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="27.0">Pick 2 past commits with a test</text>
    <path class="edge" d="M390 46 V62" marker-end="url(#ah)"/>
    <rect class="new" x="265.0" y="62" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="81.0">Write task texts, name the interface</text>
    <path class="edge" d="M390 100 V116" marker-end="url(#ah)"/>
    <polygon class="new" points="390,116.0 515.0,148 390,180.0 265.0,148"/>
    <text class="new" x="390" y="140.0">Test passes at the</text>
    <text class="new" x="390" y="156.0">commit, fails at parent?</text>
    <path class="edge" d="M515 148 H533" marker-end="url(#ah)"/>
    <text class="lbl" x="521" y="138">no</text>
    <rect class="fail" x="533" y="118" width="235" height="60" rx="6"/>
    <text class="fail" x="650.5" y="140.0">Drop the task.</text>
    <text class="fail" x="650.5" y="156.0">Under 2 tasks: stop.</text>
    <path class="edge" d="M390 180 V204" marker-end="url(#ah)"/>
    <text class="lbl" x="408" y="194">yes</text>
    <rect class="new" x="265.0" y="204" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="223.0">Build the venv. Needs your OK.</text>
    <path class="edge" d="M390 242 V260" marker-end="url(#ah)"/>
    <polygon class="new" points="390,260.0 515.0,292 390,324.0 265.0,292"/>
    <text class="new" x="390" y="284.0">python3 imports pytest</text>
    <text class="new" x="390" y="300.0">and qdrant_client?</text>
    <path class="edge" d="M515 292 H533" marker-end="url(#ah)"/>
    <text class="lbl" x="521" y="282">no</text>
    <rect class="fail" x="533" y="268" width="235" height="48" rx="6"/>
    <text class="fail" x="650.5" y="284.0">Stop the batch.</text>
    <text class="fail" x="650.5" y="300.0">Fix the venv.</text>
    <path class="edge" d="M390 324 V344" marker-end="url(#ah)"/>
    <text class="lbl" x="408" y="336">yes</text>
    <rect class="new" x="265.0" y="344" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="363.0">Smoke: 1 run per arm per task</text>
    <path class="edge" d="M390 382 V404" marker-end="url(#ah)"/>
    <polygon class="new" points="390,404.0 515.0,436 390,468.0 265.0,436"/>
    <text class="new" x="390" y="428.0">Arm A unfinished</text>
    <text class="new" x="390" y="444.0">at the memory cut?</text>
    <path class="edge" d="M515 436 H533" marker-end="url(#ah)"/>
    <text class="lbl" x="521" y="426">no</text>
    <rect class="fail" x="533" y="406" width="235" height="60" rx="6"/>
    <text class="fail" x="650.5" y="428.0">Lower the cap to 2.</text>
    <text class="fail" x="650.5" y="444.0">Repeat the smoke once.</text>
    <path class="edge" d="M390 468 V488" marker-end="url(#ah)"/>
    <text class="lbl" x="408" y="480">yes</text>
    <rect class="new" x="265.0" y="488" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="507.0">Main batch: A, N, C, 5 runs per task</text>
    <path class="edge" d="M390 526 V542" marker-end="url(#ah)"/>
    <rect class="new" x="265.0" y="542" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="561.0">Score scope, hidden test, regression</text>
    <path class="edge" d="M390 580 V596" marker-end="url(#ah)"/>
    <rect class="new" x="265.0" y="596" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="615.0">Report counts. No claim past 2 tasks</text>
  </svg>
</main>
</body>
</html>
