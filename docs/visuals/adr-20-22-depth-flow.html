<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth test flow</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #555;
    --old-fill: #e8e8e8; --old-stroke: #7a7a7a; --old-text: #1a1a1a;
    --new-fill: #cfe3ff; --new-stroke: #2a62b8; --new-text: #10264d;
    --fail-fill: #ffd6d6; --fail-stroke: #b82a2a; --fail-text: #4d1010;
    --line: #444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #ececec; --muted: #aaa;
      --old-fill: #2c2f35; --old-stroke: #8b909a; --old-text: #ececec;
      --new-fill: #1b3558; --new-stroke: #6aa4f0; --new-text: #dbe9ff;
      --fail-fill: #4a1d1d; --fail-stroke: #f08a8a; --fail-text: #ffdede;
      --line: #bbb;
    }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 10px 16px; }
  h1 { font-size: 17px; margin: 4px 0; }
  p.sub { font-size: 12.5px; margin: 0 0 6px; color: var(--muted); }
  .key { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; margin: 4px 0 6px; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 16px; height: 16px; border-radius: 3px; border: 2px solid; display: inline-block; }
  .sw.old { background: var(--old-fill); border-color: var(--old-stroke); }
  .sw.new { background: var(--new-fill); border-color: var(--new-stroke); }
  .sw.fail { background: var(--fail-fill); border-color: var(--fail-stroke); }
  svg { width: 100%; max-height: calc(100vh - 120px); display: block; }
  .old  { fill: var(--old-fill);  stroke: var(--old-stroke);  stroke-width: 1.6; }
  .new  { fill: var(--new-fill);  stroke: var(--new-stroke);  stroke-width: 1.6; }
  .fail { fill: var(--fail-fill); stroke: var(--fail-stroke); stroke-width: 1.6; }
  text { font-size: 12.5px; text-anchor: middle; dominant-baseline: central; }
  text.old  { fill: var(--old-text);  stroke: none; }
  text.new  { fill: var(--new-text);  stroke: none; }
  text.fail { fill: var(--fail-text); stroke: none; }
  text.lbl { fill: var(--fg); stroke: none; font-size: 11.5px; font-weight: 600; }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .head { fill: var(--line); stroke: none; }
</style>
</head>
<body>
<main>
  <h1>Depth test: calibrate, screen, then the main batch</h1>
  <p class="sub">Read from the top. Red boxes are stops. Two of them end the effort with a real answer: no depth loss, or no gain from re-injection. Each run is one long session with a small compaction window.</p>
  <div class="key" aria-label="Key">
    <span><i class="sw old"></i>Verified by probe</span>
    <span><i class="sw new"></i>New in Part 5</span>
    <span><i class="sw fail"></i>Failure path or stop</span>
  </div>
  <svg viewBox="0 0 780 600" role="img" aria-label="Flowchart of the depth test: calibration, screen with two stop rules, main batch and the decision on reloaded goals">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="head"/>
      </marker>
    </defs>
    <rect class="old" x="265.0" y="8" width="250" height="38" rx="6"/>
    <text class="old" x="390.0" y="27.0">Probe: compaction runs in claude -p</text>
    <path class="edge" d="M390 46 V62" marker-end="url(#ah)"/>
    <rect class="new" x="265.0" y="62" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="81.0">Calibrate window and chain on arm A</text>
    <path class="edge" d="M390 100 V116" marker-end="url(#ah)"/>
    <polygon class="new" points="390,116.0 515.0,148 390,180.0 265.0,148"/>
    <text class="new" x="390" y="140.0">1 to 3 compactions,</text>
    <text class="new" x="390" y="156.0">no thrash?</text>
    <path class="edge" d="M515 148 H533" marker-end="url(#ah)"/>
    <text class="lbl" x="521" y="138">no</text>
    <rect class="fail" x="533" y="118" width="235" height="60" rx="6"/>
    <text class="fail" x="650.5" y="132.0">Retry up to 3 times.</text>
    <text class="fail" x="650.5" y="148.0">Then stop: not testable</text>
    <text class="fail" x="650.5" y="164.0">cheaply.</text>
    <path class="edge" d="M390 180 V204" marker-end="url(#ah)"/>
    <text class="lbl" x="408" y="194">yes</text>
    <rect class="new" x="265.0" y="204" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="223.0">Screen: run arm A 3 times</text>
    <path class="edge" d="M390 242 V260" marker-end="url(#ah)"/>
    <polygon class="new" points="390,260.0 515.0,292 390,324.0 265.0,292"/>
    <text class="new" x="390" y="284.0">A keeps 4 to 9</text>
    <text class="new" x="390" y="300.0">of 12 rules?</text>
    <path class="edge" d="M265 292 H247" marker-end="url(#ah)"/>
    <text class="lbl" x="258" y="282">10+</text>
    <rect class="fail" x="12" y="262" width="235" height="60" rx="6"/>
    <text class="fail" x="129.5" y="276.0">No depth loss at this</text>
    <text class="fail" x="129.5" y="292.0">scale. Stop and report</text>
    <text class="fail" x="129.5" y="308.0">that finding.</text>
    <path class="edge" d="M515 292 H533" marker-end="url(#ah)"/>
    <text class="lbl" x="521" y="282">≤3</text>
    <rect class="fail" x="533" y="268" width="235" height="48" rx="6"/>
    <text class="fail" x="650.5" y="284.0">Too hard. Check tests</text>
    <text class="fail" x="650.5" y="300.0">and prompts first.</text>
    <path class="edge" d="M390 324 V344" marker-end="url(#ah)"/>
    <text class="lbl" x="408" y="336">yes</text>
    <rect class="new" x="265.0" y="344" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="363.0">Main batch: N, K, C, 5 runs each</text>
    <path class="edge" d="M390 382 V398" marker-end="url(#ah)"/>
    <rect class="new" x="265.0" y="398" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="417.0">Score rules, code word, compactions</text>
    <path class="edge" d="M390 436 V456" marker-end="url(#ah)"/>
    <polygon class="new" points="390,456.0 515.0,488 390,520.0 265.0,488"/>
    <text class="new" x="390" y="480.0">K or C beat N</text>
    <text class="new" x="390" y="496.0">by 2 rules?</text>
    <path class="edge" d="M515 488 H533" marker-end="url(#ah)"/>
    <text class="lbl" x="521" y="478">no</text>
    <rect class="fail" x="533" y="458" width="235" height="60" rx="6"/>
    <text class="fail" x="650.5" y="480.0">Report: no gain. Try a</text>
    <text class="fail" x="650.5" y="496.0">summary hint, or stop.</text>
    <path class="edge" d="M390 520 V544" marker-end="url(#ah)"/>
    <text class="lbl" x="408" y="534">yes</text>
    <rect class="new" x="265.0" y="544" width="250" height="38" rx="6"/>
    <text class="new" x="390.0" y="563.0">Report: reloaded goal helps</text>
  </svg>
</main>
</body>
</html>
